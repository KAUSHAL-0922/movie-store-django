{% extends 'base.html' %}

{% block content %}
<div class="container pd-3">
<div class="card mb-3">
  <div class="row g-0">
    <div>
      <div class="card-body">

        <h5 class="card-title">Add Review for {{ movie.title }} </h5>

        {% if error %}
        <div class="alert alert-danger mt-3" role="alert"> {{ error }} </div>
        {% endif %}

        <p class="card-text">
          <form method="POST">

            {% csrf_token %}   <!-- Django provides this to protect our form from cross-site request forgery (CSRF) attacks.-->
            {{ form.as_p }}     <!--To output our form data, we use form.as_p , which renders it within paragraph (<p>) tags.-->
             
            <button type="submit"
              class="btn btn-primary">
              Add Review
            </button>

          </form>
        </p>
      </div>
    </div>
  </div>
</div>
</div>

{% endblock content %}
